# =====================================================================
# BỘ 3: API DÀNH CHO NHÂN VIÊN VẬN HÀNH / ADMIN (OPERATOR APIs)
# =====================================================================
openapi: 3.0.3
info:
  title: CAB System - Operator / Admin APIs
  version: 1.0.0
paths:
  /auth/operator/login:
    post:
      summary: Nhân viên vận hành đăng nhập hệ thống [FR-03]
      tags:
        - Operator / Admin APIs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone:
                  type: string
                  example: "0905555666"
                password:
                  type: string
                  example: "AdminPass123"
      responses:
        '200':
          description: Đăng nhập thành công

  /admin/trips/active:
    get:
      summary: Giám sát toàn bộ các chuyến đi đang diễn ra (Realtime Dashboard) [FR-19]
      tags:
        - Operator / Admin APIs
      responses:
        '200':
          description: Trả về danh sách chuyến đi hoạt động

  /admin/trips/{booking_id}/intervene:
    post:
      summary: Nhân viên can thiệp xử lý sự cố (Hủy chuyến, đổi tài xế thủ công) [FR-19]
      tags:
        - Operator / Admin APIs
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [CANCEL_TRIP, REASSIGN_DRIVER]
                  example: "CANCEL_TRIP"
                note:
                  type: string
                  example: "Hỗ trợ khách hàng đổi xe do xe hỏng"
      responses:
        '200':
          description: Can thiệp thành công

  /admin/reports/revenue:
    get:
      summary: Xem báo cáo doanh thu & tổng số chuyến [FR-21]
      tags:
        - Operator / Admin APIs
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            example: "2026-09-01"
        - name: end_date
          in: query
          schema:
            type: string
            example: "2026-09-13"
      responses:
        '200':
          description: Trả về báo cáo doanh thu

  /admin/reports/cancellation-rate:
    get:
      summary: Xem báo cáo tỷ lệ hoàn thành / hủy chuyến [FR-21]
      tags:
        - Operator / Admin APIs
      responses:
        '200':
          description: Trả về tỷ lệ hủy chuyến

  /admin/audit-logs:
    get:
      summary: Xem nhật ký kiểm toán hệ thống (Audit Logs) phục vụ điều tra sự cố [FR-22]
      tags:
        - Operator / Admin APIs
      responses:
        '200':
          description: Danh sách log thao tác hệ thống
