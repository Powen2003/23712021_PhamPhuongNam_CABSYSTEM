openapi: 3.0.3
info:
  title: CAB System - Driver Dispatch API
  version: 1.0.0
paths:
  /api/v1/driver/trips/{booking_id}/respond:
    post:
      summary: Tài xế chấp nhận hoặc từ chối chuyến xe
      parameters: [{ name: booking_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [ACCEPTED, REJECTED] }
      responses: { '200': { description: "Success" } }
