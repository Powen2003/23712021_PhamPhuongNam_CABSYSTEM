# =====================================================================
# BỘ 1: API DÀNH CHO KHÁCH HÀNG (CUSTOMER APIs)
# =====================================================================
openapi: 3.0.3
info:
  title: CAB System - Customer APIs
  version: 1.0.0
paths:
  /auth/customer/register:
    post:
      summary: Khách hàng đăng ký tài khoản [FR-01]
      tags:
        - Customer APIs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password, full_name]
              properties:
                phone:
                  type: string
                  example: "0901111222"
                password:
                  type: string
                  example: "Password123"
                full_name:
                  type: string
                  example: "Nguyen Van Khach"
      responses:
        '201':
          description: Đăng ký thành công

  /bookings/estimate-fare:
    post:
      summary: Tính cước dự kiến & ETA trước khi đặt xe [FR-13]
      tags:
        - Customer APIs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup_lat, pickup_lng, dropoff_lat, dropoff_lng, vehicle_type]
              properties:
                pickup_lat:
                  type: number
                  example: 10.7725
                pickup_lng:
                  type: number
                  example: 106.6980
                dropoff_lat:
                  type: number
                  example: 10.8185
                dropoff_lng:
                  type: number
                  example: 106.6588
                vehicle_type:
                  type: string
                  enum: [BIKE, CAR_4S, CAR_7S]
                  example: "CAR_4S"
      responses:
        '200':
          description: Trả về giá tiền và thời gian di chuyển dự kiến

  /bookings:
    post:
      summary: Khách hàng tạo đơn đặt xe mới [FR-04]
      tags:
        - Customer APIs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup_address, pickup_lat, pickup_lng, dropoff_address, dropoff_lat, dropoff_lng, vehicle_type, payment_method]
              properties:
                pickup_address:
                  type: string
                  example: "Chợ Bến Thành, Q.1"
                pickup_lat:
                  type: number
                  example: 10.7725
                pickup_lng:
                  type: number
                  example: 106.6980
                dropoff_address:
                  type: string
                  example: "Sân bay Tân Sơn Nhất"
                dropoff_lat:
                  type: number
                  example: 10.8185
                dropoff_lng:
                  type: number
                  example: 106.6588
                vehicle_type:
                  type: string
                  enum: [BIKE, CAR_4S, CAR_7S]
                  example: "CAR_4S"
                payment_method:
                  type: string
                  enum: [CASH, DIGITAL_WALLET]
                  example: "DIGITAL_WALLET"
      responses:
        '201':
          description: Khởi tạo đơn, hệ thống bắt đầu quét tìm tài xế

  /bookings/{booking_id}/cancel:
    post:
      summary: Khách hàng hủy chuyến xe
      tags:
        - Customer APIs
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Hủy chuyến thành công

  /trips/{booking_id}/tracking:
    get:
      summary: Khách hàng theo dõi vị trí xe & ETA realtime [FR-12]
      tags:
        - Customer APIs
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trả về tọa độ xe di chuyển

  /payments/checkout:
    post:
      summary: Khách hàng thanh toán điện tử [FR-14]
      tags:
        - Customer APIs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_id, payment_gateway]
              properties:
                booking_id:
                  type: string
                payment_gateway:
                  type: string
                  enum: [MOMO, VNPAY, ZALOPAY]
      responses:
        '200':
          description: Chuyển hướng sang cổng thanh toán

  /payments/{booking_id}/switch-to-cash:
    post:
      summary: Chuyển sang thanh toán tiền mặt khi cổng điện tử lỗi [EX-02]
      tags:
        - Customer APIs
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Đã chuyển sang tiền mặt thành công

  /customer/trips/history:
    get:
      summary: Khách hàng xem lịch sử chuyến đi [FR-20]
      tags:
        - Customer APIs
      responses:
        '200':
          description: Lịch sử chuyến đi

  /customer/trips/{booking_id}/rate:
    post:
      summary: Khách hàng đánh giá sao và phản hồi tài xế [FR-20]
      tags:
        - Customer APIs
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating_stars]
              properties:
                rating_stars:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
                comment:
                  type: string
                  example: "Tài xế rất lịch sự"
      responses:
        '201':
          description: Đánh giá thành công
