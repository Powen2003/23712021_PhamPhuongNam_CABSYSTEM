openapi: 3.0.3
info:
  title: CAB System - Driver Auth & Vehicle API
  version: 1.0.0
paths:
  /api/v1/auth/driver/register:
    post:
      summary: Đăng ký tài khoản tài xế
      responses: { '201': { description: "Created" } }
  /api/v1/drivers/vehicle:
    post:
      summary: Cập nhật thông tin phương tiện và bằng lái
      responses: { '201': { description: "Created" } }
  /api/v1/driver/status:
    patch:
      summary: Bật/tắt trạng thái sẵn sàng (Online/Offline)
      responses: { '200': { description: "Success" } }
