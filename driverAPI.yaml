# =====================================================================
# BỘ 2: API DÀNH CHO TÀI XẾ (DRIVER APIs)
# =====================================================================
openapi: 3.0.3
info:
  title: CAB System - Driver APIs
  version: 1.0.0
paths:
  /auth/driver/register:
    post:
      summary: Tài xế đăng ký tài khoản [FR-01]
      tags:
        - Driver APIs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password, full_name]
              properties:
                phone:
                  type: string
                  example: "0903333444"
                password:
                  type: string
                  example: "Password123"
                full_name:
                  type: string
                  example: "Tran Van Tai Xe"
      responses:
        '201':
          description: Đăng ký thành công

  /drivers/vehicle:
    post:
      summary: Tài xế cập nhật thông tin phương tiện & bằng lái [FR-02]
      tags:
        - Driver APIs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_plate, vehicle_type, driver_license_no]
              properties:
                license_plate:
                  type: string
                  example: "51H-999.99"
                vehicle_type:
                  type: string
                  enum: [BIKE, CAR_4S, CAR_7S]
                  example: "CAR_4S"
                driver_license_no:
                  type: string
                  example: "B2-123456789"
      responses:
        '201':
          description: Cập nhật thông tin xe thành công

  /driver/status:
    patch:
      summary: Tài xế bật/tắt trạng thái sẵn sàng nhận đơn (Online/Offline) [FR-09]
      tags:
        - Driver APIs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_online]
              properties:
                is_online:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Thay đổi trạng thái thành công

  /driver/trips/{booking_id}/respond:
    post:
      summary: Tài xế Chấp nhận hoặc Từ chối chuyến xe được hệ thống gán [FR-06]
      tags:
        - Driver APIs
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACCEPTED, REJECTED]
                  example: "ACCEPTED"
      responses:
        '200':
          description: Phản hồi thành công

  /trips/{booking_id}/status:
    patch:
      summary: Tài xế cập nhật tiến trình chuyến đi (Đến điểm đón -> Đón khách -> Hoàn thành) [FR-10]
      tags:
        - Driver APIs
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ARRIVED, IN_PROGRESS, COMPLETED]
                  example: "IN_PROGRESS"
      responses:
        '200':
          description: Cập nhật trạng thái thành công

  /driver/location:
    post:
      summary: Tài xế gửi tọa độ GPS định kỳ lên hệ thống (Realtime tracking) [FR-11]
      tags:
        - Driver APIs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude:
                  type: number
                  example: 10.7731
                longitude:
                  type: number
                  example: 106.6986
      responses:
        '200':
          description: Nhận tọa độ GPS thành công
